[workspace]
resolver = "3"
members = [
    "crates/oma-id-agent-core",
    "crates/oma-id-agent-daemon",
    "crates/oma-id-agent-ipc",
    "crates/oma-id-pam-client",
    "crates/oma-id-pam-module",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
